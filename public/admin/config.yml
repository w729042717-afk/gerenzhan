backend:
  name: git-gateway
  branch: main
  base_url: https://zhimin.netlify.app

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: settings
    label: 网站设置
    extension: json
    format: json
    files:
      - label: 个人信息
        name: personalInfo
        file: content/settings/personalInfo.json
        fields:
          - { label: 姓名, name: name, widget: string }
          - { label: 职位, name: title, widget: string }
          - { label: 副标题, name: subtitle, widget: text }
          - { label: 个人简介, name: bio, widget: text }
          - { label: 头像, name: avatar, widget: image, required: false }
          - label: 亮点数据
            name: highlights
            widget: list
            fields:
              - { label: 标签, name: label, widget: string }
              - { label: 数值, name: value, widget: string }

      - label: 联系方式
        name: contactInfo
        file: content/settings/contactInfo.json
        fields:
          - { label: 邮箱, name: email, widget: string }
          - label: 社交链接
            name: social
            widget: object
            fields:
              - { label: GitHub 链接, name: github, widget: string, required: false }
              - { label: LinkedIn 链接, name: linkedin, widget: string, required: false }
              - { label: Twitter 链接, name: twitter, widget: string, required: false }
              - { label: Dribbble 链接, name: dribbble, widget: string, required: false }

  - name: projects
    label: 作品项目
    label_singular: 项目
    folder: content/projects
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    fields:
      - { label: 项目名称, name: title, widget: string }
      - { label: 项目描述, name: description, widget: text }
      - { label: 项目图片, name: image, widget: image, required: false }
      - label: 标签
        name: tags
        widget: list
        default: []
      - label: 链接
        name: links
        widget: object
        fields:
          - { label: 线上地址, name: live, widget: string, required: false }
          - { label: GitHub 地址, name: github, widget: string, required: false }

  - name: timeline
    label: 工作经历
    label_singular: 经历
    folder: content/timeline
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    fields:
      - { label: 时间, name: date, widget: string }
      - { label: 职位, name: title, widget: string }
      - { label: 公司, name: company, widget: string }
      - { label: 工作描述, name: description, widget: text }

  - name: skills
    label: 技能分类
    label_singular: 技能分类
    folder: content/skills
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    fields:
      - { label: 分类名称, name: category, widget: string }
      - label: 技能列表
        name: skills
        widget: list
        fields:
          - { label: 技能名称, name: name, widget: string }
          - { label: 熟练度 (0-100), name: level, widget: number, value_type: int, min: 0, max: 100 }
